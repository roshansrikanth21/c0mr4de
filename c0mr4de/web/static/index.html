<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>c0mr4de</title>
<style>
  :root {
    --bg: #0b0d10;
    --text: #c4c9d2;      /* primary reading text */
    --muted: #6a7078;     /* labels, tool logs, secondary */
    --faint: #262a31;     /* hairlines, borders */
    --panel: #101318;     /* subtle result background */
    --accent: #6bbf95;    /* the ONLY highlight colour - findings, active state */
    --accent-dim: #223026;
    --danger: #cf8b7c;    /* errors only */
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--mono); font-size: 13.5px; line-height: 1.55;
    display: flex; flex-direction: column;
  }
  header {
    padding: 13px 22px; border-bottom: 1px solid var(--faint);
    display: flex; align-items: baseline; gap: 10px;
  }
  header .logo { color: var(--accent); font-weight: 600; letter-spacing: 1px; }
  header .sub { color: var(--muted); font-size: 11px; }
  header .backend { margin-left: auto; color: var(--muted); font-size: 10.5px; opacity: .7; }

  #feed {
    flex: 1; overflow-y: auto; padding: 22px;
    max-width: 820px; width: 100%; margin: 0 auto;
  }
  /* everything is a row in a quiet vertical timeline */
  .item { padding: 3px 0; }

  /* the intro + the model's reasoning: primary, readable, no box */
  .thought { color: var(--text); white-space: pre-wrap; word-break: break-word; margin: 14px 0 6px; }
  .thought .step { color: var(--muted); font-size: 10.5px; letter-spacing: .5px; display: block; margin-bottom: 3px; }

  /* your task: quiet, just a left accent rule */
  .user { margin: 22px 0 6px; padding-left: 12px; border-left: 2px solid var(--accent-dim); color: var(--text); white-space: pre-wrap; }
  .user .step { color: var(--accent); font-size: 10.5px; letter-spacing: .5px; display: block; margin-bottom: 3px; opacity: .9; }

  /* tool calls: compact muted log lines, NOT cards */
  .tool { color: var(--muted); font-size: 12.5px; padding: 2px 0 2px 12px; }
  .tool b { color: #8a919b; font-weight: 600; }
  .tool .args { opacity: .65; }

  /* results: muted, indented, boxed subtly, truncated */
  .result { margin: 2px 0 2px 12px; padding: 7px 11px; background: var(--panel);
    border: 1px solid var(--faint); border-radius: 6px; color: var(--muted);
    font-size: 12px; white-space: pre-wrap; word-break: break-word; max-height: 140px; overflow: hidden; position: relative; }
  .result.expanded { max-height: none; }
  .result .more { position: absolute; right: 8px; bottom: 4px; font-size: 10px; color: var(--accent);
    cursor: pointer; background: var(--panel); padding: 1px 5px; opacity: .8; }

  /* THE highlight: findings / captured secrets / final report. the only real colour. */
  .finding, .final { margin: 10px 0; padding: 11px 14px; border: 1px solid var(--accent-dim);
    border-left: 3px solid var(--accent); border-radius: 6px; background: #0e130f; color: var(--text);
    white-space: pre-wrap; word-break: break-word; }
  .finding .step, .final .step { color: var(--accent); font-size: 10.5px; letter-spacing: .5px; display: block; margin-bottom: 4px; }

  .error { margin: 8px 0; padding: 10px 13px; border: 1px solid #3a2723; border-left: 3px solid var(--danger);
    border-radius: 6px; color: var(--danger); white-space: pre-wrap; }

  footer { border-top: 1px solid var(--faint); padding: 14px 22px; max-width: 820px; width: 100%; margin: 0 auto; }
  #drop { border: 1px dashed var(--faint); border-radius: 7px; padding: 7px 12px; margin-bottom: 10px;
    color: var(--muted); font-size: 11.5px; text-align: center; transition: .15s; cursor: pointer; }
  #drop.hot { border-color: var(--accent); color: var(--accent); }
  #drop .files { color: var(--text); margin-top: 3px; }
  .inputrow { display: flex; gap: 10px; }
  #task { flex: 1; background: #0e1116; color: var(--text); border: 1px solid var(--faint);
    border-radius: 7px; padding: 11px 14px; font-family: var(--mono); font-size: 13.5px; resize: none; }
  #task:focus { outline: none; border-color: #33414a; }
  #send { background: transparent; color: var(--accent); border: 1px solid var(--accent-dim);
    border-radius: 7px; padding: 0 22px; font-family: var(--mono); cursor: pointer; letter-spacing: .5px; }
  #send:hover:not(:disabled) { background: var(--accent-dim); }
  #send:disabled { color: var(--muted); border-color: var(--faint); cursor: default; }
  .spin { display: inline-block; width: 9px; height: 9px; border: 2px solid var(--faint);
    border-top-color: var(--accent); border-radius: 50%; animation: s .7s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  .attach { font-size: 11px; color: var(--muted); margin-top: 5px; }
  .attach img { max-width: 200px; border-radius: 5px; border: 1px solid var(--faint); display: block; margin-top: 5px; }
  #feed::-webkit-scrollbar { width: 8px; } #feed::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 6px; }
</style>
</head>
<body>
  <header>
    <span class="logo">c0mr4de</span>
    <span class="sub">autonomous pentest agent</span>
    <span class="backend" id="backend"></span>
  </header>

  <div id="feed">
    <div class="item thought" style="color:var(--muted)">Describe a task, or drop a screenshot / file below. Reasoning is shown plainly; tool calls are the quiet lines; findings are highlighted.</div>
  </div>

  <footer>
    <div id="drop">drop a screenshot or file, or click to pick <div class="files"></div></div>
    <input type="file" id="picker" multiple hidden />
    <div class="inputrow">
      <textarea id="task" rows="1" placeholder="e.g. pentest http://localhost:3000, chain vulns, report"></textarea>
      <button id="send">run</button>
    </div>
  </footer>

<script>
const feed = document.getElementById('feed');
const drop = document.getElementById('drop');
const picker = document.getElementById('picker');
const filesLabel = drop.querySelector('.files');
const taskEl = document.getElementById('task');
const sendBtn = document.getElementById('send');
const backendEl = document.getElementById('backend');
let attachments = [];

function el(cls, html) {
  const d = document.createElement('div');
  d.className = 'item ' + cls;
  d.innerHTML = html;
  feed.appendChild(d);
  feed.scrollTop = feed.scrollHeight;
  return d;
}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

// what counts as worth highlighting
function isFinding(text){
  return /BENCH\{|flag\{|FLAG\{|MIRAGE\{|premium unlocked|successfully solved|report written|<<<|"role":\s*"admin"/i.test(text||'');
}
function argSummary(args){
  const v = Object.values(args||{}).map(x=>typeof x==='string'?x:JSON.stringify(x)).join(' ');
  return v.length>90 ? v.slice(0,90)+'…' : v;
}

['dragover','dragenter'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('hot');}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('hot');}));
drop.addEventListener('drop', ev => handleFiles(ev.dataTransfer.files));
drop.addEventListener('click', () => picker.click());
picker.addEventListener('change', () => handleFiles(picker.files));

async function handleFiles(fileList) {
  for (const f of fileList) {
    const fd = new FormData(); fd.append('file', f);
    filesLabel.textContent = 'uploading ' + f.name + '…';
    const r = await fetch('/upload', {method:'POST', body: fd});
    const j = await r.json();
    const att = {path: j.path, is_image: j.is_image, ocr: j.ocr, name: f.name};
    if (j.is_image) att.dataUrl = await toDataUrl(f);
    attachments.push(att);
    filesLabel.textContent = attachments.map(a=>a.name).join(', ');
  }
}
function toDataUrl(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(file);});}

taskEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); }});
sendBtn.addEventListener('click', go);

function go() {
  const task = taskEl.value.trim();
  if (!task && attachments.length === 0) return;
  let full = task, attachHtml = '';
  for (const a of attachments) {
    full += `\n\n[attached file: ${a.path}]`;
    if (a.is_image && a.ocr) full += `\n[OCR of ${a.name}]:\n${a.ocr}`;
    attachHtml += a.dataUrl ? `<div class="attach">${esc(a.name)}<img src="${a.dataUrl}"/></div>` : `<div class="attach">${esc(a.name)}</div>`;
  }
  el('user', `<span class="step">you</span>${esc(task)}${attachHtml}`);
  taskEl.value = ''; attachments = []; filesLabel.textContent = '';
  sendBtn.disabled = true; sendBtn.innerHTML = '<span class="spin"></span>';

  const es = new EventSource('/run?task=' + encodeURIComponent(full));
  es.onmessage = ev => {
    const {kind, data} = JSON.parse(ev.data);
    if (kind === 'backend') backendEl.textContent = data.name;
    else if (kind === 'thought') el('thought', `<span class="step">step ${data.step}</span>${esc(data.text)}`);
    else if (kind === 'tool_call') el('tool', `→ <b>${esc(data.name)}</b> <span class="args">${esc(argSummary(data.arguments))}</span>`);
    else if (kind === 'tool_result') {
      const txt = data.result.slice(0, 4000);
      if (isFinding(txt)) el('finding', `<span class="step">finding · ${esc(data.name)}</span>${esc(txt)}`);
      else {
        const d = el('result', esc(txt));
        if (data.result.length > 400) { const m=document.createElement('span'); m.className='more'; m.textContent='more'; m.onclick=()=>{d.classList.toggle('expanded');m.textContent=d.classList.contains('expanded')?'less':'more';}; d.appendChild(m); }
      }
    }
    else if (kind === 'final') el('final', `<span class="step">summary</span>${esc(data.text)}`);
    else if (kind === 'error') el('error', esc(data.text));
    else if (kind === 'done') { es.close(); sendBtn.disabled = false; sendBtn.textContent = 'run'; }
  };
  es.onerror = () => { es.close(); sendBtn.disabled = false; sendBtn.textContent = 'run'; };
}
</script>
</body>
</html>
