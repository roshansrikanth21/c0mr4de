<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>c0mr4de</title>
<style>
  :root {
    --bg: #0b0d10;
    --bg2: #0e1116;
    --text: #c4c9d2;
    --muted: #6a7078;
    --faint: #232830;
    --panel: #12151b;
    --accent: #6bbf95;
    --accent-dim: #223026;
    --danger: #cf8b7c;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--mono);
    font-size: 13.5px; line-height: 1.55; display: flex; flex-direction: column; }

  header { padding: 12px 20px; border-bottom: 1px solid var(--faint); display: flex; align-items: baseline; gap: 10px; flex: none; }
  header .logo { color: var(--accent); font-weight: 600; letter-spacing: 1px; }
  header .sub { color: var(--muted); font-size: 11px; }
  header .backend { margin-left: auto; color: var(--muted); font-size: 10.5px; opacity: .7; }

  /* two panes: conversation (left) + activity sidebar (right) */
  #body { flex: 1; display: flex; min-height: 0; }
  #convo { flex: 1; overflow-y: auto; padding: 22px 26px; min-width: 0; }
  #convo .inner { max-width: 720px; margin: 0 auto; }
  #activity { width: 380px; flex: none; border-left: 1px solid var(--faint);
    overflow-y: auto; background: var(--bg2); display: flex; flex-direction: column; }
  #activity h4 { margin: 0; padding: 12px 16px; font-size: 11px; letter-spacing: 1px;
    text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--faint);
    position: sticky; top: 0; background: var(--bg2); display: flex; align-items: center; gap: 8px; }
  #activity h4 .count { color: var(--accent); opacity: .8; }
  #acts { padding: 8px; }

  /* CONVERSATION side: only reasoning, findings, summary. clean. */
  .intro { color: var(--muted); margin-bottom: 8px; }
  .user { margin: 18px 0 8px; padding-left: 12px; border-left: 2px solid var(--accent-dim); white-space: pre-wrap; word-break: break-word; }
  .user .lbl { color: var(--accent); font-size: 10.5px; letter-spacing: .5px; display: block; margin-bottom: 3px; opacity: .9; }
  .thought { margin: 12px 0; white-space: pre-wrap; word-break: break-word; }
  .thought .lbl { color: var(--muted); font-size: 10.5px; letter-spacing: .5px; display: block; margin-bottom: 3px; }
  .finding, .final { margin: 12px 0; padding: 11px 14px; border: 1px solid var(--accent-dim);
    border-left: 3px solid var(--accent); border-radius: 6px; background: #0e130f;
    white-space: pre-wrap; word-break: break-word; }
  .finding .lbl, .final .lbl { color: var(--accent); font-size: 10.5px; letter-spacing: .5px; display: block; margin-bottom: 4px; }
  .error { margin: 10px 0; padding: 10px 13px; border: 1px solid #3a2723; border-left: 3px solid var(--danger); border-radius: 6px; color: var(--danger); white-space: pre-wrap; }

  /* ACTIVITY side: each tool = a collapsible dropdown */
  details.act { border: 1px solid var(--faint); border-radius: 6px; margin: 6px 0; background: var(--panel); overflow: hidden; }
  details.act > summary { list-style: none; cursor: pointer; padding: 8px 11px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
  details.act > summary::-webkit-details-marker { display: none; }
  details.act > summary .caret { color: var(--muted); font-size: 10px; transition: transform .15s; }
  details.act[open] > summary .caret { transform: rotate(90deg); }
  details.act > summary .tname { color: #9aa1ab; font-weight: 600; }
  details.act > summary .tsum { color: var(--muted); opacity: .7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  details.act > summary .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex: none; }
  details.act.done > summary .dot { background: var(--accent); }
  details.act.hit { border-color: var(--accent-dim); }
  details.act.hit > summary .dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .body { padding: 0 11px 10px; }
  .body .k { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .5px; margin: 8px 0 3px; }
  .body pre { margin: 0; padding: 8px 10px; background: var(--bg); border: 1px solid var(--faint); border-radius: 5px;
    font-size: 11.5px; color: var(--muted); white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto; }

  footer { border-top: 1px solid var(--faint); padding: 14px 20px; flex: none; }
  footer .inner { max-width: 1100px; margin: 0 auto; }
  #drop { border: 1px dashed var(--faint); border-radius: 7px; padding: 7px 12px; margin-bottom: 10px; color: var(--muted); font-size: 11.5px; text-align: center; cursor: pointer; }
  #drop.hot { border-color: var(--accent); color: var(--accent); }
  #drop .files { color: var(--text); margin-top: 3px; }
  .inputrow { display: flex; gap: 10px; }
  #task { flex: 1; background: var(--bg2); color: var(--text); border: 1px solid var(--faint); border-radius: 7px; padding: 11px 14px; font-family: var(--mono); font-size: 13.5px; resize: none; }
  #task:focus { outline: none; border-color: #33414a; }
  #send { background: transparent; color: var(--accent); border: 1px solid var(--accent-dim); border-radius: 7px; padding: 0 22px; font-family: var(--mono); cursor: pointer; letter-spacing: .5px; }
  #send:hover:not(:disabled) { background: var(--accent-dim); }
  #send:disabled { color: var(--muted); border-color: var(--faint); cursor: default; }
  .spin { display: inline-block; width: 9px; height: 9px; border: 2px solid var(--faint); border-top-color: var(--accent); border-radius: 50%; animation: s .7s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  .attach { font-size: 11px; color: var(--muted); margin-top: 5px; }
  .attach img { max-width: 200px; border-radius: 5px; border: 1px solid var(--faint); display: block; margin-top: 5px; }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 6px; }
  @media (max-width: 760px) { #body { flex-direction: column; } #activity { width: auto; border-left: none; border-top: 1px solid var(--faint); max-height: 40vh; } }
</style>
</head>
<body>
  <header>
    <span class="logo">c0mr4de</span>
    <span class="sub">autonomous pentest agent</span>
    <span class="backend" id="backend"></span>
  </header>

  <div id="body">
    <div id="convo"><div class="inner" id="convoInner">
      <div class="intro">Describe a task below. The narrative — reasoning, findings, the report — shows here. Every tool the agent runs appears in the <b>Activity</b> panel on the right; expand any one to see its exact input and output.</div>
    </div></div>
    <aside id="activity">
      <h4>Activity <span class="count" id="count"></span></h4>
      <div id="acts"></div>
    </aside>
  </div>

  <footer><div class="inner">
    <div id="drop">drop a screenshot or file, or click to pick <div class="files"></div></div>
    <input type="file" id="picker" multiple hidden />
    <div class="inputrow">
      <textarea id="task" rows="1" placeholder="e.g. pentest http://localhost:3000, chain vulns, report"></textarea>
      <button id="send">run</button>
    </div>
  </div></footer>

<script>
const convo = document.getElementById('convoInner');
const acts = document.getElementById('acts');
const countEl = document.getElementById('count');
const drop = document.getElementById('drop');
const picker = document.getElementById('picker');
const filesLabel = drop.querySelector('.files');
const taskEl = document.getElementById('task');
const sendBtn = document.getElementById('send');
const backendEl = document.getElementById('backend');
let attachments = [], toolCount = 0, pending = null;

function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function addConvo(cls, html){ const d=document.createElement('div'); d.className=cls; d.innerHTML=html; convo.appendChild(d); convo.parentElement.scrollTop=convo.parentElement.scrollHeight; return d; }
function isFinding(t){ return /BENCH\{|flag\{|FLAG\{|MIRAGE\{|premium unlocked|successfully solved|report written|<<<|"role":\s*"admin"/i.test(t||''); }
function argSummary(a){ const v=Object.values(a||{}).map(x=>typeof x==='string'?x:JSON.stringify(x)).join(' '); return v; }

['dragover','dragenter'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('hot');}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('hot');}));
drop.addEventListener('drop', ev => handleFiles(ev.dataTransfer.files));
drop.addEventListener('click', () => picker.click());
picker.addEventListener('change', () => handleFiles(picker.files));

async function handleFiles(fileList){
  for (const f of fileList){ const fd=new FormData(); fd.append('file',f); filesLabel.textContent='uploading '+f.name+'…';
    const r=await fetch('/upload',{method:'POST',body:fd}); const j=await r.json();
    const att={path:j.path,is_image:j.is_image,ocr:j.ocr,name:f.name}; if(j.is_image) att.dataUrl=await toDataUrl(f);
    attachments.push(att); filesLabel.textContent=attachments.map(a=>a.name).join(', '); }
}
function toDataUrl(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(file);});}

taskEl.addEventListener('keydown', e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); go(); }});
sendBtn.addEventListener('click', go);

function addTool(name, args){
  toolCount++; countEl.textContent = toolCount;
  const d=document.createElement('details'); d.className='act';
  d.innerHTML = `<summary><span class="caret">▶</span><span class="dot"></span><span class="tname">${esc(name)}</span><span class="tsum">${esc(argSummary(args))}</span></summary>`
    + `<div class="body"><div class="k">input</div><pre>${esc(JSON.stringify(args,null,2))}</pre></div>`;
  acts.appendChild(d); acts.parentElement.scrollTop = acts.parentElement.scrollHeight;
  return d;
}
function fillResult(d, name, result){
  if(!d) return;
  const hit = isFinding(result);
  d.classList.add('done'); if(hit) d.classList.add('hit');
  const b=d.querySelector('.body');
  const k=document.createElement('div'); k.className='k'; k.textContent='output';
  const pre=document.createElement('pre'); pre.textContent = result.slice(0,6000);
  b.appendChild(k); b.appendChild(pre);
  // surface real findings in the main narrative too, not just the sidebar
  if(hit) addConvo('finding', `<span class="lbl">finding · ${esc(name)}</span>${esc(result.slice(0,1200))}`);
}

function go(){
  const task=taskEl.value.trim(); if(!task && attachments.length===0) return;
  let full=task, attachHtml='';
  for(const a of attachments){ full+=`\n\n[attached file: ${a.path}]`; if(a.is_image&&a.ocr) full+=`\n[OCR of ${a.name}]:\n${a.ocr}`;
    attachHtml += a.dataUrl?`<div class="attach">${esc(a.name)}<img src="${a.dataUrl}"/></div>`:`<div class="attach">${esc(a.name)}</div>`; }
  addConvo('user', `<span class="lbl">you</span>${esc(task)}${attachHtml}`);
  taskEl.value=''; attachments=[]; filesLabel.textContent='';
  acts.innerHTML=''; toolCount=0; countEl.textContent=''; pending=null;
  sendBtn.disabled=true; sendBtn.innerHTML='<span class="spin"></span>';

  const es=new EventSource('/run?task='+encodeURIComponent(full));
  es.onmessage=ev=>{
    const {kind,data}=JSON.parse(ev.data);
    if(kind==='backend') backendEl.textContent=data.name;
    else if(kind==='thought') addConvo('thought', `<span class="lbl">reasoning</span>${esc(data.text)}`);
    else if(kind==='tool_call') pending=addTool(data.name, data.arguments);
    else if(kind==='tool_result'){ fillResult(pending, data.name, data.result); pending=null; }
    else if(kind==='final') addConvo('final', `<span class="lbl">summary</span>${esc(data.text)}`);
    else if(kind==='error') addConvo('error', esc(data.text));
    else if(kind==='done'){ es.close(); sendBtn.disabled=false; sendBtn.textContent='run'; }
  };
  es.onerror=()=>{ es.close(); sendBtn.disabled=false; sendBtn.textContent='run'; };
}
</script>
</body>
</html>
