<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>c0mr4de</title>
<style>
  :root {
    --bg: #0a0c10;
    --panel: #12151c;
    --panel-2: #171b24;
    --line: #232936;
    --text: #d7dce5;
    --muted: #7b8494;
    --accent: #4ade80;
    --accent-dim: #1f6b40;
    --tool: #60a5fa;
    --warn: #f59e0b;
    --err: #f87171;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--mono); font-size: 14px; line-height: 1.5;
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
  }
  header .logo { color: var(--accent); font-weight: 700; letter-spacing: 1px; }
  header .sub { color: var(--muted); font-size: 12px; }
  #feed {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 10px; max-width: 900px; width: 100%; margin: 0 auto;
  }
  .msg { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); white-space: pre-wrap; word-break: break-word; }
  .msg.user { border-color: var(--accent-dim); background: #0f1712; }
  .msg .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 4px; }
  .thought .label { color: var(--muted); }
  .tool { border-color: #1e2a3a; background: var(--panel-2); }
  .tool .label { color: var(--tool); }
  .result { border-color: #1a2620; background: #0e1512; color: #b9c4bf; font-size: 13px; }
  .result .label { color: var(--accent); }
  .final { border-color: var(--accent-dim); background: #0f1712; }
  .final .label { color: var(--accent); }
  .error { border-color: #3a1e1e; background: #150e0e; }
  .error .label { color: var(--err); }
  .attach { font-size: 12px; color: var(--muted); }
  .attach img { max-width: 220px; border-radius: 6px; border: 1px solid var(--line); display: block; margin-top: 6px; }
  footer {
    border-top: 1px solid var(--line); padding: 14px 20px;
    max-width: 900px; width: 100%; margin: 0 auto;
  }
  #drop {
    border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px;
    color: var(--muted); font-size: 12px; text-align: center; transition: .15s; cursor: pointer;
  }
  #drop.hot { border-color: var(--accent); color: var(--accent); background: #0f1712; }
  #drop .files { color: var(--text); margin-top: 4px; }
  .inputrow { display: flex; gap: 10px; }
  #task {
    flex: 1; background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 11px 14px; font-family: var(--mono); font-size: 14px; resize: none;
  }
  #task:focus { outline: none; border-color: var(--accent-dim); }
  #send {
    background: var(--accent); color: #06120a; border: none; border-radius: 8px;
    padding: 0 22px; font-weight: 700; font-family: var(--mono); cursor: pointer; letter-spacing: .5px;
  }
  #send:disabled { background: var(--panel-2); color: var(--muted); cursor: default; }
  .spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--muted); border-top-color: var(--accent); border-radius: 50%; animation: s .7s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  #feed::-webkit-scrollbar { width: 9px; } #feed::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }
</style>
</head>
<body>
  <header>
    <span class="logo">c0mr4de</span>
    <span class="sub">autonomous pentest agent</span>
    <span class="sub" id="backend" style="margin-left:auto"></span>
  </header>

  <div id="feed">
    <div class="msg thought"><div class="label">ready</div>Describe a task, or drop a screenshot / file below. Images get OCR'd automatically so I can read tokens, errors, or configs out of them.</div>
  </div>

  <footer>
    <div id="drop">drop a screenshot or file here, or click to pick <div class="files"></div></div>
    <input type="file" id="picker" multiple hidden />
    <div class="inputrow">
      <textarea id="task" rows="1" placeholder="e.g. recon example.com and report the attack surface"></textarea>
      <button id="send">run</button>
    </div>
  </footer>

<script>
const feed = document.getElementById('feed');
const drop = document.getElementById('drop');
const picker = document.getElementById('picker');
const filesLabel = drop.querySelector('.files');
const taskEl = document.getElementById('task');
const sendBtn = document.getElementById('send');
const backendEl = document.getElementById('backend');
let attachments = []; // {path, is_image, ocr, name, dataUrl}

function add(kind, label, text, extraHtml='') {
  const d = document.createElement('div');
  d.className = 'msg ' + kind;
  d.innerHTML = `<div class="label">${label}</div>` + (text ? escapeHtml(text) : '') + extraHtml;
  feed.appendChild(d);
  feed.scrollTop = feed.scrollHeight;
  return d;
}
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

['dragover','dragenter'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('hot');}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('hot');}));
drop.addEventListener('drop', ev => handleFiles(ev.dataTransfer.files));
drop.addEventListener('click', () => picker.click());
picker.addEventListener('change', () => handleFiles(picker.files));

async function handleFiles(fileList) {
  for (const f of fileList) {
    const fd = new FormData(); fd.append('file', f);
    filesLabel.textContent = 'uploading ' + f.name + '...';
    const r = await fetch('/upload', {method:'POST', body: fd});
    const j = await r.json();
    const att = {path: j.path, is_image: j.is_image, ocr: j.ocr, name: f.name};
    if (j.is_image) att.dataUrl = await toDataUrl(f);
    attachments.push(att);
    filesLabel.textContent = attachments.map(a=>a.name).join(', ');
  }
}
function toDataUrl(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(file);});}

taskEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); }});
sendBtn.addEventListener('click', go);

function go() {
  const task = taskEl.value.trim();
  if (!task && attachments.length === 0) return;
  let full = task;
  let attachHtml = '';
  for (const a of attachments) {
    full += `\n\n[attached file: ${a.path}]`;
    if (a.is_image && a.ocr) full += `\n[OCR of ${a.name}]:\n${a.ocr}`;
    if (a.dataUrl) attachHtml += `<div class="attach">${a.name}<img src="${a.dataUrl}"/></div>`;
    else attachHtml += `<div class="attach">📎 ${a.name}</div>`;
  }
  add('user', 'you', task, attachHtml);
  taskEl.value = ''; attachments = []; filesLabel.textContent = '';
  sendBtn.disabled = true; sendBtn.innerHTML = '<span class="spin"></span>';

  const es = new EventSource('/run?task=' + encodeURIComponent(full));
  es.onmessage = ev => {
    const {kind, data} = JSON.parse(ev.data);
    if (kind === 'backend') { backendEl.textContent = data.name; }
    else if (kind === 'thought') add('thought', 'thinking · step ' + data.step, data.text);
    else if (kind === 'tool_call') add('tool', '→ ' + data.name, JSON.stringify(data.arguments, null, 2));
    else if (kind === 'tool_result') add('result', '← ' + data.name, data.result.slice(0, 2000));
    else if (kind === 'final') add('final', 'result', data.text);
    else if (kind === 'error') add('error', 'error', data.text);
    else if (kind === 'done') { es.close(); sendBtn.disabled = false; sendBtn.textContent = 'run'; }
  };
  es.onerror = () => { es.close(); sendBtn.disabled = false; sendBtn.textContent = 'run'; };
}
</script>
</body>
</html>
