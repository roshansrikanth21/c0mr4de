<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>c0mr4de</title>
<style>
  :root{
    --bg:#15120d; --bg2:#1b1710; --panel:#1f1a12;
    --amber:#d9a55a; --amber-dim:#8a6d3f;
    --text:#d8cebb; --muted:#8a8072; --faint:#2e2820;
    --green:#8ac98a; --red:#cf6a52;
    --mono: ui-monospace, "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;line-height:1.55;
    display:flex;flex-direction:column;overflow:hidden}
  body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:99;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.14),rgba(0,0,0,.14) 1px,transparent 1px,transparent 3px)}

  header{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--faint);flex:none}
  header .logo{color:var(--amber);font-weight:700;letter-spacing:1.5px;text-shadow:0 0 8px rgba(217,165,90,.35)}
  header .sub{color:var(--muted);font-size:11px}
  header .chip{margin-left:auto;color:var(--muted);font-size:10.5px;border:1px solid var(--faint);
    border-radius:20px;padding:4px 11px}

  #shell{flex:1;display:flex;min-height:0}
  /* SIDEBAR — chat management */
  #side{width:236px;flex:none;border-right:1px solid var(--faint);background:var(--bg2);display:flex;flex-direction:column}
  #new{margin:12px;padding:9px 12px;border:1px solid var(--amber-dim);border-radius:7px;color:var(--amber);
    background:transparent;cursor:pointer;font-family:var(--mono);font-size:12.5px;text-align:left;letter-spacing:.5px}
  #new:hover{background:#241d12}
  #chats{flex:1;overflow-y:auto;padding:0 8px 12px}
  #chats .clbl{color:var(--muted);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:6px 8px}
  .chat{padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--text);font-size:12px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chat:hover{background:#241d12}
  .chat.active{background:#2a2114;color:var(--amber)}
  .chat .t{color:var(--muted);font-size:10px}

  /* MAIN */
  #main{flex:1;display:flex;flex-direction:column;min-width:0}
  #feed{flex:1;overflow-y:auto;padding:20px 26px}
  #feed .inner{max-width:780px;margin:0 auto}
  .intro{color:var(--muted);margin-bottom:6px}

  /* terminal-style live run */
  .you{margin:16px 0 8px;color:var(--text)}
  .you .p{color:var(--amber)}
  .think{color:#c3b9a4;margin:9px 0;white-space:pre-wrap;word-break:break-word}
  .think .p{color:var(--muted)}
  .tool{color:var(--muted);font-size:12px;padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tool .b{color:#b89b6e}
  .res{margin:2px 0 4px 14px;padding:6px 10px;background:var(--bg2);border:1px solid var(--faint);
    border-radius:5px;color:var(--muted);font-size:11.5px;white-space:pre-wrap;word-break:break-word;max-height:120px;overflow:hidden}

  /* DOSSIER-style finding / report cards */
  .dossier{margin:14px 0;border:1px solid var(--faint);border-left:3px solid var(--amber);border-radius:7px;
    background:var(--panel);padding:0;overflow:hidden}
  .dossier.crit{border-left-color:var(--red)} .dossier.hi{border-left-color:#d98c4a}
  .dossier .dh{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--faint);
    background:#241d12;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
  .dossier .sev{padding:1px 8px;border-radius:3px;font-weight:700;font-size:10px;letter-spacing:1px}
  .sev.crit{background:var(--red);color:#1a1109} .sev.hi{background:#d98c4a;color:#1a1109}
  .sev.find{background:var(--green);color:#0f1a0f}
  .dossier .db{padding:12px 15px;white-space:pre-wrap;word-break:break-word;color:var(--text)}
  .dossier .db .mono{background:#241d12;padding:1px 5px;border-radius:2px;color:var(--amber)}

  .error{margin:10px 0;padding:10px 13px;border:1px solid #3a221c;border-left:3px solid var(--red);border-radius:6px;color:var(--red);white-space:pre-wrap}

  /* status bar */
  #status{flex:none;border-top:1px solid var(--faint);padding:7px 18px;display:flex;gap:22px;
    color:var(--muted);font-size:11px;background:var(--bg2)}
  #status b{color:var(--amber)} #status .st-comp{color:var(--red);font-weight:700}

  footer{flex:none;border-top:1px solid var(--faint);padding:13px 18px}
  #drop{border:1px dashed var(--faint);border-radius:7px;padding:6px 12px;margin-bottom:9px;color:var(--muted);font-size:11px;text-align:center;cursor:pointer}
  #drop.hot{border-color:var(--amber);color:var(--amber)}
  #drop .files{color:var(--text);margin-top:3px}
  .inputrow{display:flex;gap:10px}
  #task{flex:1;background:var(--bg2);color:var(--text);border:1px solid var(--faint);border-radius:7px;
    padding:11px 14px;font-family:var(--mono);font-size:13px;resize:none}
  #task:focus{outline:none;border-color:var(--amber-dim)}
  #send{background:transparent;color:var(--amber);border:1px solid var(--amber-dim);border-radius:7px;
    padding:0 22px;font-family:var(--mono);cursor:pointer;letter-spacing:.5px}
  #send:hover:not(:disabled){background:#241d12} #send:disabled{color:var(--muted);border-color:var(--faint);cursor:default}
  .spin{display:inline-block;width:9px;height:9px;border:2px solid var(--faint);border-top-color:var(--amber);border-radius:50%;animation:s .7s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .attach{font-size:11px;color:var(--muted);margin-top:5px}
  .attach img{max-width:180px;border-radius:5px;border:1px solid var(--faint);display:block;margin-top:5px}
  ::-webkit-scrollbar{width:8px} ::-webkit-scrollbar-thumb{background:var(--faint);border-radius:6px}
  @media (max-width:820px){#side{display:none}}
</style>
</head>
<body>
  <header>
    <span class="logo">c0mr4de</span><span class="sub">// autonomous pentest agent</span>
    <span class="chip" id="backend">op://localhost</span>
  </header>

  <div id="shell">
    <aside id="side">
      <button id="new">＋ new session</button>
      <div id="chats"><div class="clbl">sessions</div></div>
    </aside>
    <div id="main">
      <div id="feed"><div class="inner" id="inner">
        <div class="intro">operator&gt; describe a task. The live run reads like a terminal; findings and reports are filed as dossier entries. Sessions are saved on the left.</div>
      </div></div>
      <div id="status">
        <span>TARGET <b id="st-target">—</b></span>
        <span>STATE <b id="st-state">idle</b></span>
        <span>TOOLS <b id="st-tools">0</b></span>
      </div>
    </div>
  </div>

  <footer>
    <div id="drop">drop a screenshot or file, or click to pick <div class="files"></div></div>
    <input type="file" id="picker" multiple hidden />
    <div class="inputrow">
      <textarea id="task" rows="1" placeholder="operator> pentest http://localhost:3000, chain vulns, report"></textarea>
      <button id="send">run</button>
    </div>
  </footer>

<script>
const inner=document.getElementById('inner'), feed=document.getElementById('feed');
const chatsEl=document.getElementById('chats'), newBtn=document.getElementById('new');
const drop=document.getElementById('drop'), picker=document.getElementById('picker'), filesLabel=drop.querySelector('.files');
const taskEl=document.getElementById('task'), sendBtn=document.getElementById('send'), backendEl=document.getElementById('backend');
const stTarget=document.getElementById('st-target'), stState=document.getElementById('st-state'), stTools=document.getElementById('st-tools');
let attachments=[], currentChat=null, tools=0;

function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function add(cls,html){const d=document.createElement('div');d.className=cls;d.innerHTML=html;inner.appendChild(d);feed.scrollTop=feed.scrollHeight;return d;}
function targetFrom(t){const m=(t||'').match(/https?:\/\/[^\s'"]+|\b\d{1,3}(\.\d{1,3}){3}(:\d+)?/);return m?m[0]:'—';}
function sevOf(t){if(/critical/i.test(t))return'crit';if(/high/i.test(t))return'hi';return'find';}
function isFinding(t){return /BENCH\{|flag\{|FLAG\{|MIRAGE\{|premium unlocked|successfully solved|report written|<<<|"role":\s*"admin"/i.test(t||'');}
function argSum(a){return Object.values(a||{}).map(x=>typeof x==='string'?x:JSON.stringify(x)).join(' ');}

// dossier card for a finding/report
function dossier(label,text){
  const sev=sevOf(text); const cls=sev==='crit'?'crit':sev==='hi'?'hi':'';
  const badge=sev==='crit'?'<span class="sev crit">CRITICAL</span>':sev==='hi'?'<span class="sev hi">HIGH</span>':'<span class="sev find">CAPTURED</span>';
  return add('dossier '+cls, `<div class="dh">${esc(label)} ${badge}</div><div class="db">${esc(text)}</div>`);
}

/* ---- chat management ---- */
async function loadChats(){
  const r=await fetch('/chats'); const list=await r.json();
  chatsEl.innerHTML='<div class="clbl">sessions</div>';
  for(const c of list){
    const d=document.createElement('div'); d.className='chat'+(c.id===currentChat?' active':'');
    d.innerHTML=`${esc(c.title)}<div class="t">${new Date(c.updated*1000).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div>`;
    d.onclick=()=>openChat(c.id); chatsEl.appendChild(d);
  }
}
async function newChat(){const r=await fetch('/chats/new',{method:'POST'});const c=await r.json();currentChat=c.id;resetFeed();await loadChats();}
function resetFeed(){inner.innerHTML='';tools=0;stTools.textContent='0';stTarget.textContent='—';stState.textContent='idle';stState.className='';add('intro','operator&gt; new session. describe a task.');}
async function openChat(id){
  const r=await fetch('/chats/'+id); const doc=await r.json(); if(doc.error)return;
  currentChat=id; inner.innerHTML=''; tools=0; loadChats();
  for(const turn of doc.turns){
    if(turn.role==='user') add('you',`<span class="p">operator&gt;</span> ${esc(turn.content)}`);
    else if(turn.role==='summary'){
      for(const ev of (turn.events||[])) renderEvent(ev.kind, ev.data);
    }
  }
  feed.scrollTop=feed.scrollHeight;
}

/* ---- rendering an event (live or replayed) ---- */
function renderEvent(kind,data){
  if(kind==='thought') add('think',`<span class="p">[think]</span> ${esc(data.text)}`);
  else if(kind==='tool_call'){tools++;stTools.textContent=tools;add('tool',`<span class="b">→ ${esc(data.name)}</span> ${esc(argSum(data.arguments))}`);}
  else if(kind==='tool_result'){
    if(isFinding(data.result)){dossier('finding · '+data.name, data.result.slice(0,1400));stState.textContent='COMPROMISED';stState.className='st-comp';}
    else add('res',esc(data.result.slice(0,800)));
  }
  else if(kind==='finding') dossier('finding', data.text||'');
  else if(kind==='final') dossier('report · summary', data.text);
  else if(kind==='error') add('error',esc(data.text));
}

/* ---- uploads ---- */
['dragover','dragenter'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('hot');}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('hot');}));
drop.addEventListener('drop',ev=>handleFiles(ev.dataTransfer.files)); drop.addEventListener('click',()=>picker.click());
picker.addEventListener('change',()=>handleFiles(picker.files));
async function handleFiles(fl){for(const f of fl){const fd=new FormData();fd.append('file',f);filesLabel.textContent='uploading '+f.name+'…';
  const r=await fetch('/upload',{method:'POST',body:fd});const j=await r.json();const a={path:j.path,is_image:j.is_image,ocr:j.ocr,name:f.name};
  if(j.is_image)a.dataUrl=await toDataUrl(f);attachments.push(a);filesLabel.textContent=attachments.map(x=>x.name).join(', ');}}
function toDataUrl(f){return new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f);});}

/* ---- run ---- */
newBtn.onclick=newChat;
taskEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go();}});
sendBtn.addEventListener('click',go);

async function go(){
  const task=taskEl.value.trim(); if(!task&&attachments.length===0)return;
  if(!currentChat){const r=await fetch('/chats/new',{method:'POST'});currentChat=(await r.json()).id;}
  let full=task, ah='';
  for(const a of attachments){full+=`\n\n[attached file: ${a.path}]`;if(a.is_image&&a.ocr)full+=`\n[OCR of ${a.name}]:\n${a.ocr}`;
    ah+=a.dataUrl?`<div class="attach">${esc(a.name)}<img src="${a.dataUrl}"/></div>`:`<div class="attach">${esc(a.name)}</div>`;}
  add('you',`<span class="p">operator&gt;</span> ${esc(task)}${ah}`);
  stTarget.textContent=targetFrom(full); stState.textContent='running'; stState.className='';
  taskEl.value='';attachments=[];filesLabel.textContent='';
  sendBtn.disabled=true;sendBtn.innerHTML='<span class="spin"></span>';

  const es=new EventSource('/run?chat_id='+encodeURIComponent(currentChat)+'&task='+encodeURIComponent(full));
  es.onmessage=ev=>{const {kind,data}=JSON.parse(ev.data);
    if(kind==='backend'){backendEl.textContent=data.name.replace('rotating:','').replace(/openai-compat:|ollama:/g,'');}
    else if(kind==='done'){es.close();sendBtn.disabled=false;sendBtn.textContent='run';if(stState.textContent==='running'){stState.textContent='done';}loadChats();}
    else renderEvent(kind,data);
  };
  es.onerror=()=>{es.close();sendBtn.disabled=false;sendBtn.textContent='run';};
}
loadChats();
</script>
</body>
</html>
