# Copy this to config.yaml and fill in your choice. config.yaml is
# gitignored so your API keys never get committed.

# --- Optional: multiple models you can switch between live from the UI ---
# Define named presets under `models:` and point `active_model:` at one. The
# web UI's model dropdown switches between them; the choice is remembered in
# config/runtime.json and takes effect on the next run (no restart). Each
# preset takes the same shape as the `backend:` block below. If `active_model`
# is unset or missing, c0mr4de falls back to the single `backend:` block.
#
# active_model: local-120b
# models:
#   local-120b:
#     type: openai_compatible
#     model: gpt-oss-120b
#     base_url: http://localhost:8080/v1   # your Colibri / llama.cpp / vLLM endpoint
#     api_key: local
#   qwen-coder-32b:
#     type: ollama
#     model: qwen2.5-coder:32b
#     host: http://localhost:11434
#   cloud-claude:
#     type: anthropic
#     model: claude-sonnet-5
#     # api_key via ANTHROPIC_API_KEY env var

backend:
  # --- Option 1: free, local, unlimited tokens, slower/weaker reasoning ---
  type: ollama
  model: qwen2.5-coder:7b
  host: http://localhost:11434

  # --- Option 2: Claude, best reasoning/tool-use, costs per token ---
  # type: anthropic
  # model: claude-sonnet-5
  # api_key: sk-ant-...          # or set ANTHROPIC_API_KEY env var and omit this

  # --- Option 3: hosted open-weight model (DeepSeek-R1, Kimi K2, Qwen3-235B, ...) ---
  # cheaper than Anthropic per token, smaller reasoning gap than local 7B.
  # type: openai_compatible
  # model: deepseek-ai/DeepSeek-R1
  # base_url: https://api.deepinfra.com/v1/openai   # or Together/Fireworks/OpenRouter/Groq
  # api_key: ...

  # --- Option 4: FREE rotating hybrid (recommended for free + capable + never-stops) ---
  # Tries each member in round-robin; on rate-limit it advances to the next
  # provider, on error it fails forward. Free capable APIs first, local 7B last
  # as a never-fully-stops fallback. Get one free key per provider (you create
  # the accounts): Groq -> console.groq.com, Gemini -> aistudio.google.com.
  # Keep every member OpenAI-compatible (do NOT put the anthropic type in here).
  # Verify current free models/limits when you set it up - they change.
  #
  # NOTE on free limits: Groq free = 8000 tokens/MINUTE and ~200k tokens/DAY.
  # Long autonomous runs exhaust the daily cap. That's why a SECOND free cloud
  # provider (Gemini) matters - the chain fails Groq->Gemini before dropping to
  # the slow local model. The rotating backend now correctly does that failover.
  #
  # type: rotating
  # chain:
  #   - type: openai_compatible
  #     model: openai/gpt-oss-120b            # verified free+capable on Groq (120B)
  #     base_url: https://api.groq.com/openai/v1
  #     api_key: gsk_...                       # free Groq key
  #   - type: openai_compatible
  #     model: gemini-2.5-flash
  #     base_url: https://generativelanguage.googleapis.com/v1beta/openai
  #     api_key: ...                            # free Google AI Studio key - add this to survive Groq's daily cap
  #   - type: ollama                            # last resort - never fully stops
  #     model: qwen2.5-coder:7b
  #     host: http://localhost:11434
